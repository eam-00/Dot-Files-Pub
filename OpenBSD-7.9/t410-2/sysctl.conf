## -----------------------------------------------
## /etc/sysctl.conf from t410-2
## -----------------------------------------------

# I recommend researching and testing with `sysctl(8)` before doing anything here for safety,
# there are tons of parameters to explore.

# Shared memory is a method of sharing a common memory space for inter-process communication (IPC)
# Modern browsers, multimedia apps, databases, games, containers, vms

# Total number of pages, 1 page per 4096 bytes. ill put 1966080 pages for my 8gb tp ((8GB-512M)/4096)
kern.shminfo.shmall=1966080

# Cap for each shm segment, for safety, ill set it dividing my memory by 16.
# 512mb is enough (db shared_buffer, browser cache).
kern.shminfo.shmmax=536870912

# Max number of segments in a system (enough space for multitasks, containers, vms)
kern.shminfo.shmmni=2048

# Max number of segments a single process can attach to
# (allows browsers/multimedia with many tabs/processes use multiple segments)
kern.shminfo.shmseg=2048

# IPC semaphores (sync between processes)
# Total semaphores
kern.seminfo.semmns=4096

# Total sets of semaphores, 1024 x average semaphores per set should equal to SEMMNS
kern.seminfo.semmni=1024

# Max processes and open file descriptors (enough for me. browsers, compiling, multitasking)
kern.maxproc=8192
## kern.maxfiles=16384
kern.maxfiles=32768
kern.maxthread=16384

# Vnode is a kernel abstraction of a file system, it represents a file system object (good for caching)
kern.maxvnodes=100000 # max tracked filesystem objects by the kernel (open files, dirs, sockets, etc.)

# --------------
# Network tuning
# --------------
# Max number of pending TCP connections in listen queue
# (useful on p2p, modern browsers open tons of connections), 1024 feels enough for me
kern.somaxconn=1024
# UDP receive and send buffers, useful for streaming and calls
net.inet.udp.recvspace=262144
net.inet.udp.sendspace=262144
# Default TCP MSS to ethernet MTU
net.inet.tcp.mssdflt=1460
# Reduce idle keepalive time to detect dead connections faster
net.inet.tcp.keepidle=300
# Increase interface queue max length for better burst handling
net.inet.ip.ifq.maxlen=4096
# For ipv6
net.inet6.ip6.ifq.maxlen=4096

# Enable hyperthreading, check https://www.openbsd.org/faq/faq10.html before
hw.smt=1

## EOF ##
